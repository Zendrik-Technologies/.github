<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#07080B"/>
    <stop offset="0.5" stop-color="#0B0E14"/>
    <stop offset="1" stop-color="#07080B"/>
  </linearGradient>

  <linearGradient id="cyan" x1="500" y1="80" x2="1100" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00E5FF"/>
    <stop offset="1" stop-color="#818CF8"/>
  </linearGradient>

  <linearGradient id="prism" x1="790" y1="80" x2="900" y2="390" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00E5FF"/>
    <stop offset="1" stop-color="#818CF8"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="18" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" stroke="#1A2230" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1600" height="520" rx="28" fill="url(#bg)"/>
<rect width="1600" height="520" rx="28" fill="url(#grid)" opacity=".34"/>

<circle cx="800" cy="250" r="170" fill="#00E5FF" opacity=".035" filter="url(#glow)"/>

<g opacity=".7">
  <circle cx="130" cy="110" r="2" fill="#00E5FF"/>
  <circle cx="1460" cy="100" r="2" fill="#818CF8"/>
  <circle cx="1370" cy="390" r="2" fill="#10B981"/>
  <circle cx="230" cy="400" r="2" fill="#818CF8"/>
</g>

<g transform="translate(730 58)">
  <path d="M70 0L140 40V120L70 160L0 120V40L70 0Z"
        fill="#0B0E14"
        stroke="#263241"
        stroke-width="2"/>

  <path d="M70 0L140 40L70 80L0 40L70 0Z"
        fill="url(#prism)"
        opacity=".9"/>

  <path d="M0 40L70 80V160L0 120V40Z"
